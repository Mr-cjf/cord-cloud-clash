; ============================================================
; rules-self.ini —— rules.ini 的自有订阅适配版（供 subconverter 外部配置用）
; 适配机场命名：地区用中文（日本/新加坡/美国/台湾），倍率写作 -0.1倍 / -0.01倍（无 [倍率:x] 方括号）
; 改动：重映射 8 个测速组（倍率组→按 -x倍 匹配，香港组→美国低倍率，因为该机场无香港节点）
;       并新增 exclude_remarks 过滤「剩余流量/套餐到期/距离下次重置」伪节点
; 生成日期：2026-10-29
; ============================================================


